services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-kb-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://kb:${POSTGRES_PASSWORD:-local-kb-password}@db:5432/kb
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_EMBEDDINGS_URL: ${YANDEX_EMBEDDINGS_URL:-https://llm.api.cloud.yandex.net/foundationModels/v1/textEmbedding}
      YANDEX_DOC_EMBEDDING_MODEL: ${YANDEX_DOC_EMBEDDING_MODEL:-}
      YANDEX_QUERY_EMBEDDING_MODEL: ${YANDEX_QUERY_EMBEDDING_MODEL:-}
      YANDEX_OPENAI_BASE_URL: ${YANDEX_OPENAI_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      YANDEX_CHAT_MODEL: ${YANDEX_CHAT_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-500}
      LLM_MIN_CONFIDENCE: ${LLM_MIN_CONFIDENCE:-0.7}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      VECTOR_TOP_K: ${VECTOR_TOP_K:-5}
      BM25_TOP_K: ${BM25_TOP_K:-5}
      FUSION_TOP_K: ${FUSION_TOP_K:-5}
      RRF_K: ${RRF_K:-60}
      EVIDENCE_MAX_COSINE_DISTANCE: ${EVIDENCE_MAX_COSINE_DISTANCE:-0.78}
      EVIDENCE_MIN_BM25_SCORE: ${EVIDENCE_MIN_BM25_SCORE:-2.0}
    depends_on:
      db:
        condition: service_healthy
    networks: [private, edge]

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api]
    networks: [edge]

networks:
  private:
    internal: true
  edge: {}

volumes:
  postgres_data:
